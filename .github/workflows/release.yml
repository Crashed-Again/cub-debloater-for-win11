name: Build and release

# Push a tag like v2.0.0 to build the installer and publish it as a GitHub release.
# You can also run it by hand from the Actions tab (Run workflow) to get the .msi as a download.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the app and the installer
        shell: cmd
        run: build-msi.bat

      - name: Add a fixed-name copy of the installer (Cub.msi)
        shell: pwsh
        run: |
          $msi = Get-ChildItem out\Cub-*.msi | Select-Object -First 1
          Copy-Item $msi.FullName out\Cub.msi

      - name: Keep the build as a download
        uses: actions/upload-artifact@v4
        with:
          name: Cub-installer
          path: |
            out/Cub.msi
            out/Cub-*.msi

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Cub.msi
            out/Cub-*.msi
